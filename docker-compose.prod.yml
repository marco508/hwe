# Surcouche production (VPS dkpsolution) — à combiner avec docker-compose.yml :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Accès via Traefik (HTTPS automatique) :
#   https://hwe.dkpsolution.tech         → landing
#   https://hwe.dkpsolution.tech/api     → API
#   https://owner.hwe.dkpsolution.tech   → espace propriétaire
#   https://tenant.hwe.dkpsolution.tech  → espace locataire
# Les ports bruts ne sont exposés qu'en local (127.0.0.1).
#
# Secrets et SMTP dans /opt/hwe/.env (JWT_SECRET obligatoire en prod).

name: hwe

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *logging
    ports:
      - "127.0.0.1:5435:5432"

  api:
    <<: *logging
    environment:
      JWT_SECRET: ${JWT_SECRET:?definir JWT_SECRET dans .env}
      CORS_ORIGINS: https://hwe.dkpsolution.tech,https://owner.hwe.dkpsolution.tech,https://tenant.hwe.dkpsolution.tech
      NODE_ENV: production
      # E-mails (rappels de loyers, quittances, fins de bail). Sans SMTP_HOST,
      # les messages sont journalisés au lieu d'être envoyés.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "127.0.0.1:4005:4000"
    labels:
      traefik.enable: "true"
      traefik.http.routers.hwe-api.rule: Host(`hwe.dkpsolution.tech`) && PathPrefix(`/api`)
      traefik.http.routers.hwe-api.entrypoints: websecure
      traefik.http.routers.hwe-api.tls.certresolver: letsencrypt
      traefik.http.services.hwe-api.loadbalancer.server.port: "4000"

  landing:
    <<: *logging
    build:
      args:
        NEXT_PUBLIC_API_URL: https://hwe.dkpsolution.tech/api
        NEXT_PUBLIC_TENANT_URL: https://tenant.hwe.dkpsolution.tech
        NEXT_PUBLIC_OWNER_URL: https://owner.hwe.dkpsolution.tech
    environment:
      NEXT_PUBLIC_API_URL: https://hwe.dkpsolution.tech/api
      NEXT_PUBLIC_TENANT_URL: https://tenant.hwe.dkpsolution.tech
      NEXT_PUBLIC_OWNER_URL: https://owner.hwe.dkpsolution.tech
      NODE_ENV: production
    ports:
      - "127.0.0.1:3006:3006"
    labels:
      traefik.enable: "true"
      traefik.http.routers.hwe-landing.rule: Host(`hwe.dkpsolution.tech`)
      traefik.http.routers.hwe-landing.entrypoints: websecure
      traefik.http.routers.hwe-landing.tls.certresolver: letsencrypt
      traefik.http.services.hwe-landing.loadbalancer.server.port: "3006"

  owner-web:
    <<: *logging
    build:
      args:
        NEXT_PUBLIC_API_URL: https://hwe.dkpsolution.tech/api
    environment:
      NEXT_PUBLIC_API_URL: https://hwe.dkpsolution.tech/api
      NODE_ENV: production
    ports:
      - "127.0.0.1:3005:3005"
    labels:
      traefik.enable: "true"
      traefik.http.routers.hwe-owner.rule: Host(`owner.hwe.dkpsolution.tech`)
      traefik.http.routers.hwe-owner.entrypoints: websecure
      traefik.http.routers.hwe-owner.tls.certresolver: letsencrypt
      traefik.http.services.hwe-owner.loadbalancer.server.port: "3005"

  tenant-web:
    <<: *logging
    build:
      args:
        NEXT_PUBLIC_API_URL: https://hwe.dkpsolution.tech/api
    environment:
      NEXT_PUBLIC_API_URL: https://hwe.dkpsolution.tech/api
      NODE_ENV: production
    ports:
      - "127.0.0.1:3004:3001"
    labels:
      traefik.enable: "true"
      traefik.http.routers.hwe-tenant.rule: Host(`tenant.hwe.dkpsolution.tech`)
      traefik.http.routers.hwe-tenant.entrypoints: websecure
      traefik.http.routers.hwe-tenant.tls.certresolver: letsencrypt
      traefik.http.services.hwe-tenant.loadbalancer.server.port: "3001"

volumes:
  # Volume de données existant du déploiement d'origine — ne pas recréer.
  hwe-pgdata:
    name: hwe_hwe-pgdata
    external: true
